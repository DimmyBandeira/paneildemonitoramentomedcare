<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Médico</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@pulsoid/socket@1.0.0/dist/pulsoid-socket.min.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 p-6">
  <header class="mb-8 flex items-center justify-between">
    <h1 class="text-3xl font-semibold">Central de Triagem</h1>
    <span class="rounded-full bg-emerald-500/20 px-4 py-1 text-emerald-300 text-sm border border-emerald-400/30">Médico Online</span>
  </header>
  <section class="grid md:grid-cols-2 xl:grid-cols-3 gap-6">
    {% for p in patients %}
    <article class="rounded-2xl border border-white/10 bg-white/5 backdrop-blur-xl p-5 shadow-lg shadow-rose-500/10" data-patient-id="{{ p['id'] }}">
      <h2 class="text-xl font-medium">Paciente {{ p['username'] }}</h2>
      <p class="mt-3 text-slate-300">BPM Atual: <span class="text-emerald-400 font-semibold bpm">{{ p['latest_bpm'] or '--' }}</span></p>
      <p class="text-sm mt-1 status text-emerald-400">Sensor conectado</p>
      <button class="mt-4 rounded-lg bg-rose-500 px-4 py-2 hover:bg-rose-400 transition" onclick="getInsight({{ p['id'] }})">Gerar Insight IA</button>
    </article>
    {% endfor %}
  </section>

  <div id="insight-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm items-center justify-center p-4 z-50">
    <div class="w-full max-w-2xl rounded-2xl border border-white/10 bg-slate-900/90 p-6 shadow-2xl shadow-rose-500/20">
      <div class="flex items-center justify-between">
        <h3 class="text-xl font-semibold">Relatório de Insight IA</h3>
        <button onclick="closeModal()" class="text-slate-300 hover:text-white">✕</button>
      </div>
      <pre id="insight-content" class="mt-4 whitespace-pre-wrap text-sm text-slate-200 bg-white/5 rounded-xl p-4 border border-white/10">Carregando...</pre>
    </div>
  </div>

  <script>
    function openModal(text) {
      const modal = document.getElementById('insight-modal');
      document.getElementById('insight-content').textContent = text;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('insight-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function simulatePulse(card){
      const bpmEl = card.querySelector('.bpm');
      const status = card.querySelector('.status');
      const ws = new WebSocket('wss://dev.pulsoid.net/api/v1/data/real_time?access_token={{ pulsoid_token }}');
      ws.onmessage = (ev) => {
        try {
          const data = JSON.parse(ev.data);
          const bpm = data?.data?.heart_rate ?? data?.heart_rate;
          if (bpm) bpmEl.textContent = bpm;
          status.textContent = 'Sensor conectado';
          status.className = 'text-sm mt-1 status text-emerald-400';
        } catch (_) {}
      };
      ws.onerror = ws.onclose = () => {
        status.textContent = 'Sensor Desconectado (Baixa Adesão)';
        status.className = 'text-sm mt-1 status text-rose-400';
      };
    }

    document.querySelectorAll('[data-patient-id]').forEach(simulatePulse);

    async function getInsight(patientId){
      openModal('Carregando análise cardiológica...');
      try {
        const res = await fetch(`/api/gemini/analyze/${patientId}`, { method: 'POST' });
        const data = await res.json();
        openModal(data.insight || 'Não foi possível gerar insight.');
      } catch (_) {
        openModal('Falha ao comunicar com o backend clínico.');
      }
    }
  </script>
</body>
</html>
