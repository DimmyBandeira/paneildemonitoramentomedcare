<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitor Cardiago | Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <div class="relative min-h-screen flex items-center justify-center p-6">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,#f43f5e33,transparent_45%),radial-gradient(circle_at_bottom,#10b98133,transparent_45%)]"></div>
    <div class="relative w-full max-w-md rounded-2xl border border-white/10 bg-white/5 p-8 backdrop-blur-xl shadow-2xl shadow-rose-500/20">
      <h1 class="text-3xl font-semibold tracking-tight">Monitor Cardiago</h1>
      <p class="text-slate-300 mt-2">Acesso inteligente para MVP clínico.</p>
      <form action="/auth" method="post" class="mt-8 space-y-4">
        <label class="block text-sm text-slate-300">CRM ou CPF</label>
        <input name="username" required placeholder="CRM/SP123456 ou 12345678901" class="w-full rounded-xl border border-white/10 bg-slate-900/80 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-rose-500" />
        <button class="w-full rounded-xl bg-rose-500 hover:bg-rose-400 transition py-3 font-medium">Entrar</button>
      </form>
    </div>
  </div>
</body>
</html>
